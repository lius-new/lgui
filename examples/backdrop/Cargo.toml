[package]
name = "backdrop"
version = "0.1.0"
edition = "2021"
publish = false
description = "Frosted-glass window demo for LGUI: blurs the desktop content behind the window"

[dependencies]
lgui = { path = "../..", features = ["renderer-skia-software", "widgets"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }
