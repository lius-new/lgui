[package]
name = "lgui-skia-metal-features"
version = "0.1.0"
edition = "2021"
publish = ["crates-io"]
description = "Target-specific Skia Metal feature bridge for lgui"
license.workspace = true
repository = "https://github.com/lius-new/lgui"
homepage = "https://github.com/lius-new/lgui"

[target.'cfg(target_os = "macos")'.dependencies]
skia-safe = { version = "=0.99.0", default-features = false, features = ["binary-cache", "embed-icudtl", "gl", "jpeg", "metal", "pdf", "svg", "textlayout"] }
