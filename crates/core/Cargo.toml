[package]
name = "lgui-core"
version = "0.2.0"
edition = "2021"
publish = ["crates-io"]
description = "Platform-neutral runtime and UI primitives for LGUI"
license.workspace = true
readme = "README.md"
repository = "https://github.com/lius-new/lgui"
homepage = "https://github.com/lius-new/lgui"
documentation = "https://docs.rs/lgui-core"
keywords = ["gui", "desktop", "widgets", "reactive"]
categories = ["gui", "rendering"]

[features]
default = ["router", "store", "widgets"]
async = []
desktop = ["backend-winit", "clipboard", "open-url", "dialogs", "accessibility"]
backend-winit = [
  "renderer-skia",
]
accessibility = ["backend-winit"]
advanced-rendering = [
  "renderer-d2d",
  "renderer-gdi",
]
renderer-skia = [
  "images",
  "svg",
]
renderer-skia-gl = [
  "renderer-skia",
  "backend-winit",
]
renderer-skia-vulkan = [
  "renderer-skia",
  "backend-winit",
]
renderer-skia-vulkan-windows = [
  "renderer-skia-vulkan",
]
renderer-skia-vulkan-linux = [
  "renderer-skia-vulkan",
]
renderer-skia-metal = [
  "renderer-skia",
  "backend-winit",
]
backend-win32 = []
clipboard = ["dep:arboard"]
dialogs = ["dep:rfd"]
open-url = ["dep:open"]
diagnostics = []
diagnostics-serde = ["diagnostics", "dep:serde"]
diagnostics-timing = ["diagnostics"]
persistent-cache = ["dep:sha2"]
system-diagnostics = ["diagnostics", "backend-win32"]
images = ["dep:image", "dep:ureq"]
images-win32 = ["images", "backend-win32"]
multi-window = []
notifications = []
notifications-win32 = ["notifications", "backend-win32"]
router = []
renderer-gdi = ["backend-win32", "dep:image"]
renderer-d2d = ["backend-win32", "diagnostics", "images-win32", "svg"]
store = []
svg = [
  "images",
  "dep:icondata",
]
theme = []
tokio = ["async", "dep:tokio"]
test-support = []
tray = []
tray-win32 = ["tray", "backend-win32"]
windows-platform = ["backend-win32"]
widgets = ["theme"]

[dependencies]
arboard = { version = "3.6", optional = true }
icondata = { version = "0.7.0", optional = true, default-features = false, features = ["lucide"] }
image = { version = "0.25", optional = true, default-features = false, features = ["gif", "jpeg", "png", "webp"] }
keyboard-types = "0.8"
open = { version = "5.3", optional = true }
rfd = { version = "0.15", optional = true }
serde = { version = "1", optional = true, features = ["derive"] }
sha2 = { version = "0.10", optional = true }
tokio = { version = "1", optional = true, features = ["rt"] }
ureq = { version = "2.12", optional = true, default-features = true, features = ["native-certs"] }
unicode-segmentation = "1.12"
unicode-bidi = "0.3"
