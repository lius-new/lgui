[package]
name = "lgui-core"
version = "0.2.0"
edition = "2021"
publish = ["crates-io"]
description = "Platform-neutral runtime and UI primitives for LGUI"
license.workspace = true
readme = "README.md"
repository = "https://github.com/lius-new/lgui"
homepage = "https://github.com/lius-new/lgui"
documentation = "https://docs.rs/lgui-core"
keywords = ["gui", "desktop", "widgets", "reactive"]
categories = ["gui", "rendering"]

[features]
default = []
async = []
backend-winit = [
  "renderer-skia",
]
accessibility = ["backend-winit"]
advanced-rendering = [
  "renderer-d2d",
  "renderer-gdi",
]
renderer-skia = []
renderer-skia-gl = [
  "renderer-skia",
  "backend-winit",
]
renderer-skia-vulkan = [
  "renderer-skia",
  "backend-winit",
]
renderer-skia-vulkan-windows = [
  "renderer-skia-vulkan",
]
renderer-skia-vulkan-linux = [
  "renderer-skia-vulkan",
]
renderer-skia-metal = [
  "renderer-skia",
  "backend-winit",
]
backend-win32 = []
diagnostics-serde = ["dep:serde"]
diagnostics-timing = []
persistent-cache = ["dep:sha2"]
multi-window = []
renderer-gdi = ["backend-win32", "dep:image"]
renderer-d2d = ["backend-win32", "dep:image"]
tokio = ["async", "dep:tokio"]
test-support = []

[dependencies]
image = { version = "0.25", optional = true, default-features = false, features = ["gif", "jpeg", "png", "webp"] }
keyboard-types = "0.8"
serde = { version = "1", optional = true, features = ["derive"] }
sha2 = { version = "0.10", optional = true }
tokio = { version = "1", optional = true, features = ["rt"] }
unicode-segmentation = "1.12"
unicode-bidi = "0.3"
