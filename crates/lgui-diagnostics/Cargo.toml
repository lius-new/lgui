[package]
name = "lgui-diagnostics"
version = "0.2.2"
edition = "2024"
publish = ["crates-io"]
description = "Frame diagnostics contracts and collection for LGUI"
license.workspace = true
readme = "README.md"
repository = "https://github.com/lius-new/lgui"
homepage = "https://github.com/lius-new/lgui"
documentation = "https://docs.rs/lgui-diagnostics"
keywords = ["gui", "diagnostics", "profiling", "rendering"]
categories = ["gui", "development-tools::profiling"]

[features]
default = []
serde = ["dep:serde"]

[dependencies]
lgui-core = { version = "0.2.2", path = "../lgui-core", default-features = false }
serde = { version = "1", optional = true, features = ["derive"] }

