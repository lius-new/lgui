[package]
name = "lgui-render-win32-raster"
version = "0.2.0"
edition = "2021"
publish = ["crates-io"]
description = "Shared Win32 raster, image, blur, and cache support for LGUI renderers"
license.workspace = true
readme = "README.md"
repository = "https://github.com/lius-new/lgui"
homepage = "https://github.com/lius-new/lgui"
documentation = "https://docs.rs/lgui-render-win32-raster"
keywords = ["gui", "rendering", "win32", "raster"]
categories = ["gui", "rendering", "os::windows-apis"]

[features]
default = []
gdi = [
  "dep:lgui-assets",
  "dep:lgui-platform-win32",
  "lgui-core/renderer-gdi",
]
d2d = [
  "dep:lgui-assets",
  "dep:lgui-platform-win32",
  "lgui-core/renderer-d2d",
]

[dependencies]
lgui-assets = { version = "0.2.0", path = "../lgui-assets", optional = true, default-features = false, features = ["images"] }
lgui-core = { version = "0.2.0", path = "../lgui-core", default-features = false }
lgui-platform-win32 = { version = "0.2.0", path = "../lgui-platform-win32", optional = true, default-features = false, features = ["backend-win32", "images-win32"] }

[dev-dependencies]
lgui-core = { version = "0.2.0", path = "../lgui-core", default-features = false, features = ["test-support"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_GdiPlus",
  "Win32_UI_Shell",
] }
