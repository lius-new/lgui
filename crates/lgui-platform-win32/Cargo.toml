[package]
name = "lgui-platform-win32"
version = "0.2.0"
edition = "2021"
publish = ["crates-io"]
description = "Native Win32 window and system integration for LGUI"
license.workspace = true
readme = "README.md"
repository = "https://github.com/lius-new/lgui"
homepage = "https://github.com/lius-new/lgui"
documentation = "https://docs.rs/lgui-platform-win32"
keywords = ["gui", "desktop", "windows", "win32"]
categories = ["gui", "os::windows-apis"]

[features]
default = ["backend-winit"]
backend-winit = []
diagnostics = ["dep:lgui-diagnostics"]
diagnostics-timing = ["diagnostics", "lgui-core/diagnostics-timing"]
images = ["dep:image", "dep:lgui-assets"]
notifications-win32 = ["lgui-services/notifications"]
store = ["dep:lgui-store"]
svg = ["images", "dep:resvg", "dep:tiny-skia", "dep:usvg", "lgui-assets/svg"]
system-diagnostics = ["diagnostics"]
tray-win32 = ["svg", "lgui-services/tray"]

[dependencies]
image = { version = "0.25", optional = true, default-features = false, features = ["gif", "jpeg", "png", "webp"] }
lgui-assets = { version = "0.2.0", path = "../lgui-assets", optional = true, default-features = false }
lgui-core = { version = "0.2.0", path = "../lgui-core", default-features = false }
lgui-diagnostics = { version = "0.2.0", path = "../lgui-diagnostics", optional = true }
lgui-render-api = { version = "0.2.0", path = "../lgui-render-api" }
lgui-services = { version = "0.2.0", path = "../lgui-services", default-features = false }
lgui-store = { version = "0.2.0", path = "../lgui-store", optional = true }
resvg = { version = "0.45", optional = true }
tiny-skia = { version = "0.11", optional = true }
usvg = { version = "0.45", optional = true }

[dev-dependencies]
lgui-core = { version = "0.2.0", path = "../lgui-core", default-features = false, features = ["test-support"] }
lgui-render-api = { version = "0.2.0", path = "../lgui-render-api", features = ["test-support"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = [
  "Data_Xml_Dom",
  "UI_Notifications",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
  "Win32_System_ProcessStatus",
  "Win32_System_SystemInformation",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
