[package]
name = "lgui-services"
version = "0.2.2"
edition = "2024"
publish = ["crates-io"]
description = "Desktop service contracts and adapters for LGUI"
license.workspace = true
readme = "README.md"
repository = "https://github.com/lius-new/lgui"
homepage = "https://github.com/lius-new/lgui"
documentation = "https://docs.rs/lgui-services"
keywords = ["gui", "desktop", "clipboard", "notifications"]
categories = ["gui"]

[features]
default = []
clipboard = ["dep:arboard"]
dialogs = ["dep:rfd"]
open-url = ["dep:open"]
notifications = []
tray = []

[dependencies]
arboard = { version = "3.6", optional = true }
lgui-core = { version = "0.2.2", path = "../lgui-core", default-features = false }
open = { version = "5.3", optional = true }
rfd = { version = "0.15", optional = true }

[dev-dependencies]
lgui-core = { version = "0.2.2", path = "../lgui-core", default-features = false, features = ["test-support"] }

