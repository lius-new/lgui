[package]
name = "lgui-router"
version = "0.2.2"
edition = "2024"
publish = ["crates-io"]
description = "Declarative routing for LGUI applications"
license.workspace = true
readme = "README.md"
repository = "https://github.com/lius-new/lgui"
homepage = "https://github.com/lius-new/lgui"
documentation = "https://docs.rs/lgui-router"
keywords = ["gui", "router", "desktop", "reactive"]
categories = ["gui"]

[dependencies]
lgui-core = { version = "0.2.2", path = "../lgui-core", default-features = false }

[dev-dependencies]
lgui-core = { version = "0.2.2", path = "../lgui-core", default-features = false, features = ["test-support"] }
