[package]
name = "lgui-skia-vulkan-linux-features"
version = "0.1.0"
edition = "2021"
publish = ["crates-io"]
description = "Target-specific Skia Vulkan feature bridge for lgui on Linux"
repository = "https://github.com/lius-new/lgui"
homepage = "https://github.com/lius-new/lgui"

[dependencies]
skia-safe = { version = "=0.99.0", default-features = false, features = ["all-linux", "vulkan"] }
