[package]
name = "lgui"
version = "0.2.0"
edition = "2021"
publish = ["crates-io"]
description = "A reactive Rust GUI library with native and portable rendering backends"
license.workspace = true
readme = "README.md"
repository = "https://github.com/lius-new/lgui"
homepage = "https://github.com/lius-new/lgui"
documentation = "https://docs.rs/lgui"
keywords = ["gui", "desktop", "widgets", "reactive"]
categories = ["gui", "rendering"]

[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
license = "MIT OR Apache-2.0"

[features]
default = ["renderer-gdi", "router", "store", "widgets"]
async = ["lgui-core/async"]
desktop = ["lgui-core/desktop"]
backend-winit = ["lgui-core/backend-winit"]
accessibility = ["lgui-core/accessibility"]
advanced-rendering = ["lgui-core/advanced-rendering"]
renderer-skia = ["lgui-core/renderer-skia"]
renderer-skia-gl = ["lgui-core/renderer-skia-gl"]
renderer-skia-vulkan = ["lgui-core/renderer-skia-vulkan"]
renderer-skia-vulkan-windows = ["lgui-core/renderer-skia-vulkan-windows"]
renderer-skia-vulkan-linux = ["lgui-core/renderer-skia-vulkan-linux"]
renderer-skia-metal = ["lgui-core/renderer-skia-metal"]
backend-win32 = ["lgui-core/backend-win32"]
clipboard = ["lgui-core/clipboard"]
dialogs = ["lgui-core/dialogs"]
open-url = ["lgui-core/open-url"]
diagnostics = ["lgui-core/diagnostics"]
diagnostics-serde = ["lgui-core/diagnostics-serde"]
diagnostics-timing = ["lgui-core/diagnostics-timing"]
persistent-cache = ["lgui-core/persistent-cache"]
system-diagnostics = ["lgui-core/system-diagnostics"]
images = ["lgui-core/images"]
images-win32 = ["lgui-core/images-win32"]
multi-window = ["lgui-core/multi-window"]
notifications = ["lgui-core/notifications"]
notifications-win32 = ["lgui-core/notifications-win32"]
router = ["lgui-core/router"]
renderer-gdi = ["lgui-core/renderer-gdi"]
renderer-d2d = ["lgui-core/renderer-d2d"]
store = ["lgui-core/store"]
svg = ["lgui-core/svg"]
theme = ["lgui-core/theme"]
tokio = ["lgui-core/tokio"]
tray = ["lgui-core/tray"]
tray-win32 = ["lgui-core/tray-win32"]
windows-platform = ["lgui-core/windows-platform"]
widgets = ["lgui-core/widgets"]

[dependencies]
lgui-core = { version = "0.2.0", path = "crates/core", default-features = false }

[[example]]
name = "counter"
required-features = ["renderer-skia-gl", "widgets"]
