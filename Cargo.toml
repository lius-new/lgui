[package]
name = "lgui"
version = "0.1.0"
edition = "2021"
publish = false
readme = "README.md"

[features]
default = ["router", "store", "widgets"]
async = []
backend-win32 = ["dep:windows"]
diagnostics = []
diagnostics-serde = ["diagnostics", "dep:serde"]
router = []
store = []
theme = []
tokio = ["async", "dep:tokio"]
widgets = ["theme"]

[dependencies]
serde = { version = "1", optional = true, features = ["derive"] }
tokio = { version = "1", optional = true, features = ["rt"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", optional = true, features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_HiDpi",
  "Win32_UI_WindowsAndMessaging",
] }
